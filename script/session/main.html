<script>
let session = null;
let timer = null;
let inputConfig = null;

window.onload = function(){
  google.script.run
    .withSuccessHandler(on_data_loader)
    .withFailureHandler(on_data_error)
    .get_data_from_server_pro()
}

function on_data_loader(config){
  inputConfig = config
  setting = new Setting(config.settings);
  session = new WorkoutSession(config.workouts);
  analytics = new Analytics(config.analytics);

  timer = new Timer(setting.workoutSession_prepTimeSec, setting.workoutSession_overtrainingMultiplier);
  timer.onTick = updateTimerCallback;
  updateDataBsTheme()
  render()
}

function on_data_error(err){
  document.getElementById("loadStatus").textContent = 'Не получилось загрузить упражнения' + err.message;
}

function render() {
  // updateBarLine();
  updateSetCount();
  updateViewVisibilityBtn();
  updateViewVisibility();
  renderTable();
  renderList();
  updateCard();
  renderWorkoutSwitcher();
  renderTree();
  renderCompletedTable();
  updateCompletedCart();
  renderHeatmap();
  updatePageVisibility();
}
</script>
