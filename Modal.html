<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Подключаем Bootstrap 5 CSS через CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Подключения иконок -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f4f5f7;
      padding: 5px;
      user-select: none;
    }
    #draggable-header {
      cursor: move;
    }
    /* Стили для миниатюры упражнения */
    .exercise-thumb {
      width: 25px;
      height: 25px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #dee2e6;
    }

    .progress {
      position: relative;
    }

    /* Общий класс для линий */
    .progress-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #fff; /* Цвет линии */
      z-index: 3;             /* Поверх полосы */
      pointer-events: none;   /* Чтобы они не мешали кликам, если нужно */
    }
    
    .thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid #dee2e6; }
    .cc-photo{ min-height:320px; max-height: 366px; height:100%; width:100%; object-fit:cover; }
    .cc-dot{ width:10px; height:10px; border-radius:50%; padding:0; }
    #ccCard.cc-done{ border-color:#198754; border-width:2px; background:#f4fbf7; }
  </style>


</head>
<body id="body">
<div class="container py-4" style="max-width:1200px;" >
  <!-- Первый блок -->
  <div id="control_card" class="card shadow-sm mb-3">
    <div class="card-body text-center">

      <!-- Таймер -->
      <div class="display-4 fw-bold clock mt-4 mb-4" id="timer_text" value='0'>00:00:00</div>

      <!-- Прогрес бар -->
      <div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" style="height: 25px">
        <!-- Линии деления -->
        <div id="line-first" class="progress-line"></div>
        <div id="line-second" class="progress-line"></div>
        <!-- progress-bar-animated - анимирует полосу -->
        <!-- progress-bar-striped -  делает полосу полосамтой -->
        <div id="my_progress" class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 0%">0%</div>
      </div>

      <!-- текст под Прогрес бар -->
      <div class="d-flex justify-content-between small text-secondary mt-1">
        <span id="labelPrep">Подготовка</span>
        <span id="labelTrain">Тренировка</span>
        <span id="labelOver">Перетренированность</span>
      </div>

      <!-- Кнопки управления -->
      <div class="btn-group w-100 mt-3" role="group">
        <button class="btn btn-success" id="start_timer"><i class="bi bi-play-fill"></i> <span id="btnStartLabel">Старт</span></button>
        <button class="btn btn-warning" id="pause_timer" disabled><i class="bi bi-pause-fill"></i> Пауза</button>
        <button class="btn btn-danger" id="stop_timer" disabled><i class="bi bi-stop-fill"></i> Финиш</button>
      </div>
    </div>
  </div>

    <!-- workout switch (left) + set count (left) ... view switch (right) -->
  <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <div class="btn-group" role="group" aria-label="Тренировка">
        <input type="radio" class="btn-check" name="workoutMode" id="workoutMain" checked>
        <label class="btn btn-outline-primary btn-sm" for="workoutMain">Основная</label>

        <input type="radio" class="btn-check" name="workoutMode" id="workoutExtra">
        <label class="btn btn-outline-primary btn-sm" for="workoutExtra">Дополнительная</label>
      </div>
      <span class="text-secondary small">Выполнено сетов: <b id="totalSets">0</b></span>
    </div>

     <!-- Через name="viewMode" получаем все кнопки, а по checked определяем активную, скрываем все (представления) через d-none -->
    <div class="btn-group" role="group" aria-label="Вид списка">
      <input type="radio" class="btn-check" name="viewMode" id="viewTable" checked>
      <label class="btn btn-outline-secondary btn-sm" for="viewTable"><i class="bi bi-table"></i> Таблица</label>

      <input type="radio" class="btn-check" name="viewMode" id="viewList">
      <label class="btn btn-outline-secondary btn-sm" for="viewList"><i class="bi bi-list-ul"></i> Список</label>

      <input type="radio" class="btn-check" name="viewMode" id="viewCarousel">
      <label class="btn btn-outline-secondary btn-sm" for="viewCarousel"><i class="bi bi-images"></i> Карточка</label>
    </div>
  </div>

  <!-- Третий блок: Таблица -->
  <div class="card shadow-sm" id="tableView">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:64px;">Фото</th>
            <th>Упражнение</th>
            <th style="width:100px;">Повторения</th>
            <th style="width:90px;">Вес, кг</th>
            <th style="width:70px;">Время</th>
            <th style="width:170px;">Сеты</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- LIST VIEW  d-none -->
  <div class="list-group shadow-sm d-none" id="listView"></div>

  <!-- CARD VIEW — one exercise card that behaves like a carousel d-none -->
  <div class="d-none" id="carouselView">
    <!-- Если упражнения выполнено накинуть класс cc-done -->
    <div class="card shadow-sm cc-done" id="ccCard">
      <div class="row g-0">
        <div class="col-12 col-md-5 position-relative">
          <!-- Основное фото -->
          <img id="ccPhoto" src="" alt="" class="cc-photo rounded-start">
          <!-- Отобразить в зависимости от того есть хотябы один сет или нет через  d-none -->
          <span class="badge text-bg-success position-absolute top-0 start-0 m-2 d-none" id="ccDoneBadge"><i class="bi bi-check-lg"></i> Выполнено</span>
        </div>
        <div class="col-12 col-md-7">
          <div class="card-body d-flex flex-column h-100">
            <div>
              <!-- Номер упражнения по счету -->
              <span class="badge text-bg-secondary mb-2" id="ccCounter">1 / 12</span>
              <!-- Название упражнения -->
              <h5 class="card-title" id="ccName"></h5>
              <!-- 180 сек / подход · выполнено сетов: 0 -->
              <p class="text-secondary small mb-3" id="ccMeta"></p>
              <div class="d-flex gap-3 mb-3 flex-wrap">
                <div class="input-group input-group-sm" style="width:130px;">
                  <span class="input-group-text">Повт</span>
                  <!-- Количество повторений -->
                  <input type="number" min="0" class="form-control" id="ccReps" name="reps">
                </div>
                <div class="input-group input-group-sm" style="width:120px;">
                  <span class="input-group-text">Кг</span>
                  <!-- Веса для упражнения -->
                  <input type="number" min="0" class="form-control" id="ccWeight" name="weight">
                </div>
              </div>
            </div>
            <div class="mt-auto">
              <!-- +1 и -1 для упражнения -->
              <div class="mb-3" id="ccStepperWrap"></div>
              <div class="d-flex justify-content-between align-items-center">
                <button class="btn btn-outline-secondary btn-sm" id="ccPrev"><i class="bi bi-chevron-left"></i> Пред.</button>
                 <!-- Точки как в каруселе -->
                <div class="d-flex gap-1" id="ccDots"></div>
                <button class="btn btn-outline-secondary btn-sm" id="ccNext">След. <i class="bi bi-chevron-right"></i></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="text-center text-secondary small mt-2">Нажми «+1 сет» — карточка сама перейдёт к следующему упражнению. Точки внизу — быстрый переход, зелёная = есть хотя бы один сет.</p>
  </div>

</div>

  <script>

    let rawMain = [];
    let rawExtra = [];
    let ccId = 0; // текущий номер карточки

    // Загрузка данных при открытии
    window.onload = function() {
      google.script.run
      .withSuccessHandler(renderUI2)
      .withFailureHandler(showError2)
      .getTrainingData2();
    };

    function renderUI2(data){
      rawMain = data.rawMain;
      rawExtra = data.rawExtra;

      renderTable(rawMain);
      renderList(rawMain);
      ccId = 0;
      renderCard(rawMain, ccId);

    }

    function showError2(err){
      console.error('Ошибка загрузки данных:', err);
      alert('Ошибка: ' + err.message);
    }

    let my_progress = document.getElementById('my_progress');
    let timer_text = document.getElementById('timer_text')
    

    // Время тренировки в секундах
    let seconds_training_time = 505
    // Время перед началом тренировки
    let seconds_preparation_time = 20
    // Общее время тренироровки, +20% сверху для красной зоны
    let total_time = Math.ceil(seconds_preparation_time + seconds_training_time + (seconds_training_time * 0.2))
    // Длина шага для 1 секнды в процентах
    let step = parseFloat((100 / total_time).toFixed(2))

    // Для интервала в 1 сек
    let interval_bar = null;
    // Флаг для стиля заднего фона
    current_bg_style = 'bg-warning'


    /* Две полоски разделения шккалы времени */
    // Отступ слева в процентах для seconds_preparation_time
    let firstOffset = parseFloat((step * seconds_preparation_time).toFixed(2));
    // Отступ слева для seconds_training_time + seconds_preparation_time
    let secondOffset = parseFloat((step * (seconds_training_time + seconds_preparation_time)).toFixed(2)); ; // от конца в пикселях

    // Устновить отступы для линии на прогрес баре
    document.getElementById('line-first').style.left = firstOffset + '%';
    document.getElementById('line-second').style.left = secondOffset + '%';


    // Обработка кнопки старта таймера
    document.getElementById('start_timer').addEventListener('click', function(){

      // Заблокировать кнопку старта
      document.getElementById('start_timer').setAttribute('disabled', 'true')
      // Разблокировать кнопку паузы
      document.getElementById('pause_timer').removeAttribute('disabled')
      // Разблокировать кнопку финиша
      document.getElementById('stop_timer').removeAttribute('disabled')

      // Баг, если мы на паузе, то не нужно устанавливать тренировка не етап подготовки, используем этам что есть, или в работе или финиш
      if(document.getElementById('btnStartLabel').textContent != 'Продолжить'){
        // Перевести карточку в режым подготовки
        document.getElementById('control_card').classList.add('border-warning', 'border-2', 'border-opacity-50');
        // Если была пауза, то востановить занчения кнопки
        document.getElementById('btnStartLabel').textContent = "Старт"
      }
      
      // Таймер можно запустить только если он был остановлен ранее
      if (interval_bar === null){
        interval_bar = setInterval(function(){
          // получить текущее значения *23%* и перевести в число 23
          let currentWidth = parseFloat(my_progress.style.width);
          // Расчиатть новое значение
          let newWidth = parseFloat((currentWidth + step).toFixed(2));
          // Влияте на отображения ширины
          my_progress.style.width = newWidth + '%';
          // Влияет на число внутри бара
          my_progress.textContent = newWidth + '%';

          // Получить текущее значения секунд которое храниться в атрибуте value
          let current_seconds = parseInt(timer_text.getAttribute('value'), 10);
    
          // (свич) При достижении 10 меняем задний фон
          if (current_seconds >= seconds_preparation_time && current_bg_style != 'bg-success'){
            my_progress.classList.replace("bg-warning", "bg-success")
            current_bg_style = "bg-success"
            // Перевести карточку в работу
            document.getElementById('control_card').classList.replace("border-warning", "border-success")
          }

          // (свич) При достижении 50 меняем задний фон еще раз
          if(current_seconds >= (seconds_training_time + seconds_preparation_time) && current_bg_style === 'bg-success'){
            my_progress.classList.replace("bg-success", "bg-danger")
            current_bg_style = "bg-danger"
            // Перевести карточку в опасную зону перетренерованности
            document.getElementById('control_card').classList.replace("border-success", "border-danger")
          }
          
          // Обновления таймера
          // Обновить содержымое тега, и указхать времия в формате 00:00:00
          timer_text.textContent = format_time(current_seconds + 1);
          // Обновить значения секунды, хранить актуально значения для слудующего цыкла
          timer_text.setAttribute('value', current_seconds + 1);

          console.log('Прошла секунда');
        }, 1000);
      }
    });


    // Обработка остановки таймера
    document.getElementById('pause_timer').addEventListener('click', function(){
      // Разблокировать кнопку старта
      document.getElementById('start_timer').removeAttribute('disabled')
      // Заблокировать кнопку паузы
      document.getElementById('pause_timer').setAttribute('disabled', 'true')
      // Заблокировать кнопку финиша
      document.getElementById('stop_timer').setAttribute('disabled', 'true')
      // Кнопку старт, заменить на продолжыть
      document.getElementById('btnStartLabel').textContent = "Продолжить"

      if(interval_bar != null){
        clearInterval(interval_bar); // Останавливаем интервал
        interval_bar = null;         // Очищаем переменную
      }
    });

    // При нажании на финиш идет запись данных в таблицу
    document.getElementById("stop_timer").addEventListener('click', function(){
      interval_bar = null;

      // Передаем данные на сервер
      google.script.run
        .withSuccessHandler(function(response) {
            document.getElementById("body").innerHTML = '<h1>Тренеровка закончеда, данные записаны</h1>'
        })
        .withFailureHandler(function(err) {console.error('Ошибка: ' + err.message);})
        .saveExecution2(rawMain);

    })

    /*  Число сикунд перевести в часы, минуты и секунды */
    function format_time(seconds){
      // Получить количество часов
      let hours = Math.floor(seconds / 3600);
      // Получить количество минут
      let minutes = Math.floor((seconds % 3600) / 60);
      // Получить количество секунд
      let secs = seconds % 60;

      // Добавить спереди 0 если число короче 2 знаков
      let formattedHours = String(hours).padStart(2, '0');
      let formattedMinutes = String(minutes).padStart(2, '0');
      let formattedSeconds = String(secs).padStart(2, '0');

      return `${formattedHours}:${formattedMinutes}:${formattedSeconds}`
    }
  </script>

  function renderCard(raw, id=0){

  // Рендеринг определенной карточки 
  function goToCard(id){
    // тру или фолс, в зависимости активный или нет
    let activeWorkout = document.getElementById("workoutMain").checked;
    if(activeWorkout){
      // что бы карточки ходили по кругу
      if (id >= rawMain.length) {id = 0; } else if (id < 0) {id = rawMain.length - 1; }
      renderCard(rawMain, id)
    }else{
      if (id >= rawExtra.length) {id = 0; } else if (id < 0) {id = rawExtra.length - 1; }
      renderCard(rawExtra, id)
    }

  // кнопка вперед и назад ля карточек
  document.getElementById('ccPrev').addEventListener('click', function(){

  document.getElementById('ccNext').addEventListener('click', function(){

  });

  /* Переключатель, между таблицей, списокм и карточкой */
  let viewListBTN = ['viewTable', 'viewList', 'viewCarousel']
  for(let i = 0; i < viewListBTN.length; i++){
    document.getElementById(`${viewListBTN[i]}`).addEventListener('change', function(){
      // получить текущий активный елемент (какая кнопка активная)
      let model = document.querySelector('input[name="viewMode"]:checked').id;
      // Скрыть блок если не текущая
      document.getElementById("tableView").classList.toggle("d-none", model != 'viewTable')
      document.getElementById("listView").classList.toggle("d-none", model != 'viewList')
      document.getElementById("carouselView").classList.toggle("d-none", model != 'viewCarousel')

      // Сделать новый ренедеринг карточки при изменени выда отображения
      let activeWorkout = document.getElementById("workoutMain").checked;
      let raw = activeWorkout ? rawMain : rawExtra;

      if (model === 'viewTable')   renderTable(raw);
      if (model === 'viewList')    renderList(raw);
      if (model === 'viewCarousel') renderCard(raw, ccId);

    });
  }

  /* переключатель межлу основной тренировкой и дополнительной */
  let viewListWorkout= ['workoutMain', 'workoutExtra'];
  for(let i = 0; i < viewListWorkout.length; i++){
    document.getElementById(`${viewListWorkout[i]}`).addEventListener("change", function(){
      // тру или фолс, в зависимости активный или нет
      let activeWorkout = document.getElementById(`${viewListWorkout[i]}`).checked;
      // айдишник текущего кнопки
      let activeWorkoutid = document.getElementById(`${viewListWorkout[i]}`).id;

      // если текущий айдшник основная тренировка и она выбрана то отобразить ее
      if(activeWorkout && activeWorkoutid === "workoutMain"){
        renderTable(rawMain)
        renderList(rawMain)
        ccId = 0
        renderCard(rawMain, ccId)
        return
      }
      if(activeWorkout && activeWorkoutid === "workoutExtra"){
        renderTable(rawExtra)
        renderList(rawExtra)
        // баг, когда упражнения разные и я менаю тренирровку и могу обратиться к айдишнику которого нету
        ccId = 0
        renderCard(rawExtra, ccId)
        return
      }

    })

  }

  function formatDateTime(date){
  let dd = String(date.getDate()).padStart(2, '0');
  let mm = String(date.getMonth() + 1).padStart(2, '0');
  let yyyy = date.getFullYear();
  let hh = String(date.getHours()).padStart(2, '0');
  let min = String(date.getMinutes()).padStart(2, '0');
  let ss = String(date.getSeconds()).padStart(2, '0');
  return `${dd}.${mm}.${yyyy} ${hh}:${min}:${ss}`;
  }

  /* Фиксация сета +1 или -1*/
  function changeSets(id, delta){
    let activeWorkout = document.getElementById("workoutMain").checked;
    // если основное форкфров активное
    if(activeWorkout){
      // сеты нельзя сделать меньше нуля
      if(rawMain[id].sets === 0 && delta === -1){
        delta = 0
      }
      rawMain[id].sets += delta;
      rawMain[id].timedone = formatDateTime(new Date());
      renderTable(rawMain)
      renderList(rawMain)
      renderCard(rawMain, ccId+delta)
      return
    }else{
      if(rawExtra[id].sets === 0 && delta === -1){
        delta = 0
      }
      rawExtra[id].sets += delta;
      rawExtra[id].timedone = formatDateTime(new Date());
      renderTable(rawExtra)
      renderList(rawExtra)
      renderCard(rawExtra, ccId+delta)
      return
    }
  }

  /* 
  Единый обработчик изменения "Повторений" и "Веса".
  Работает через ДЕЛЕГИРОВАНИЕ: слушатель висит не на самих <input>,
  а на их родительском контейнере (tableBody / listView), который
  НИКОГДА не пересоздаётся через innerHTML. Событие "change" всплывает
  (bubbles) от input вверх до контейнера — поэтому обработчик сработает
  даже для инпутов, которые были созданы заново при renderTable()/renderList().
  Это решает баг: раньше querySelectorAll брал "снимок" инпутов один раз
  при загрузке, а после любого renderTable()/renderList() эти инпуты
  уничтожались и создавались новые — уже без обработчиков.

  сджелал клауд, логику понял
*/
function handleRepsOrWeightChange(event) {
  const target = event.target;

  // Реагируем только на нужные поля, остальные change-события в контейнере игнорируем
  if (target.name !== 'reps' && target.name !== 'weight') return;

  // Какая тренировка сейчас активна — основная или дополнительная
  let activeWorkout2 = document.getElementById("workoutMain").checked;
  let value = Number(target.value);
  let data_index = Number(target.getAttribute('data-index'));

  // Выбираем нужный массив данных
  let raw = activeWorkout2 ? rawMain : rawExtra;

  // Записываем новое значение в нужное поле ('reps' или 'weight')
  raw[data_index][target.name] = value;

  console.log(`Изменено: ${target.name} = ${value}, index = ${data_index}, activeWorkout2 = ${activeWorkout2}`);
}

  // Навешиваем ОДИН обработчик на каждый постоянный контейнер.
  // tableBody и listView — сами контейнеры не пересоздаются, меняется только их innerHTML.
  document.getElementById('tableBody').addEventListener('change', handleRepsOrWeightChange);
  document.getElementById('listView').addEventListener('change', handleRepsOrWeightChange);

  // ccReps и ccWeight — статичные поля карточки-карусели, они не пересоздаются,
  // у них просто меняется .value при каждом renderCard(), поэтому обычный
  // addEventListener на сам инпут тоже будет работать стабильно.
  document.getElementById('ccReps').addEventListener('change', handleRepsOrWeightChange);
  document.getElementById('ccWeight').addEventListener('change', handleRepsOrWeightChange);

  

</script>
